  <link rel="stylesheet" href="../css/styles.css">
  <script>window.DECK_CATALOG = [{"slug": "chapter-01", "title": "Chapter 1", "n": 1}, {"slug": "chapter-02", "title": "Chapter 2", "n": 2}, {"slug": "chapter-04", "title": "Chapter 4", "n": 4}, {"slug": "chapter-05", "title": "Chapter 5", "n": 5}, {"slug": "chapter-06", "title": "Chapter 6", "n": 6}, {"slug": "chapter-07", "title": "Chapter 7", "n": 7}, {"slug": "chapter-08", "title": "Chapter 8", "n": 8}, {"slug": "chapter-09", "title": "Chapter 9", "n": 9}, {"slug": "chapter-10", "title": "Chapter 10", "n": 10}, {"slug": "chapter-11", "title": "Chapter 11", "n": 11}, {"slug": "chapter-12", "title": "Chapter 12", "n": 12}, {"slug": "chapter-13", "title": "Chapter 13", "n": 13}, {"slug": "chapter-14", "title": "Chapter 14", "n": 14}, {"slug": "chapter-15", "title": "Chapter 15", "n": 15}, {"slug": "chapter-16", "title": "Chapter 16", "n": 16}, {"slug": "chapter-17", "title": "Chapter 17", "n": 17}, {"slug": "chapter-18", "title": "Chapter 18", "n": 18}, {"slug": "chapter-19", "title": "Chapter 19", "n": 19}, {"slug": "chapter-20", "title": "Chapter 20", "n": 20}, {"slug": "chapter-21", "title": "Chapter 21", "n": 21}, {"slug": "chapter-25", "title": "Chapter 25", "n": 25}, {"slug": "chapter-26", "title": "Chapter 26", "n": 26}];</script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">PH</span>
        <span class="brand-text">
          <strong data-site-title>Pathophysiology Study Hub</strong>
          <span class="byline" data-owner hidden></span>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="nav" id="site-nav">
        <a href="../index.html" data-nav="home">Home</a>
        <a href="../powerpoints/index.html" data-nav="powerpoints">PowerPoints</a>
        <a href="../practice/index.html" data-nav="practice">Practice Tests</a>
        <a href="../docs/index.html" data-nav="docs">Study Docs</a>

        <a href="../videos/index.html" data-nav="videos">Videos &amp; Links</a>
      </nav>
    </div>
  </header>

  <div class="viewer-shell" id="main">
    <aside class="viewer-side">
      <h1>Lecture decks</h1>
      <p>Choose a chapter</p>
      <div id="deck-list"></div>
    </aside>
    <div class="viewer-main">
      <div class="viewer-toolbar">
        <strong id="deck-title">Lecture PDF</strong>
        <a class="btn secondary" id="dl-pdf" href="#">Download PDF</a>
        <a class="btn" id="dl-pptx" href="#">Download PPTX</a>
      </div>
      <object id="deck-object" class="viewer-frame" type="application/pdf" data="about:blank">
        <iframe id="deck-iframe" class="viewer-frame" title="Lecture PDF" src="about:blank"></iframe>
        <p id="deck-fallback" style="padding:16px">This browser could not display the PDF. Use the download buttons above.</p>
      </object>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var slug = params.get("deck") || (window.DECK_CATALOG[0] && window.DECK_CATALOG[0].slug);
      var list = document.getElementById("deck-list");
      window.DECK_CATALOG.forEach(function (d) {
        var a = document.createElement("a");
        a.className = "side-link" + (d.slug === slug ? " is-active" : "");
        a.href = "view.html?deck=" + encodeURIComponent(d.slug);
        a.textContent = d.title;
        list.appendChild(a);
      });
      var deck = window.DECK_CATALOG.find(function (d) { return d.slug === slug; });
      if (!deck) {
        document.getElementById("deck-title").textContent = "Deck not found";
        return;
      }
      var pdf = "../files/slides/" + deck.slug + ".pdf";
      var pptx = "../files/slides/" + deck.slug + ".pptx";
      document.getElementById("deck-title").textContent = deck.title;
      document.title = deck.title + " · Pathophysiology Study Hub";
      document.getElementById("dl-pdf").href = pdf;
      document.getElementById("dl-pdf").setAttribute("download", "");
      document.getElementById("dl-pptx").href = pptx;
      document.getElementById("dl-pptx").setAttribute("download", "");
      document.getElementById("deck-object").setAttribute("data", pdf);
      document.getElementById("deck-iframe").src = pdf;
    })();
  </script>
</body></html>
